services:
  - name: checkout
    owner: "payments-core"
    env: "prod"
    criticality: "critical"
    ops:
      opsgenie_service_tag: "service:checkout"
      runbook: "https://runbooks.example.com/checkout"
    argocd:
      app: "checkout"
    kubernetes:
      namespace: "checkout"
    elasticsearch:
      index_pattern: "logs-2026.02.14"
      query: "service:checkout"
    victoriametrics:
      labels:
        service: "checkout"
        namespace: "checkout"
      queries:
        error_rate: 'sum(rate(http_requests_total{selector},status=~"5..")[5m]))'
        latency_p95: 'histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{selector}[5m])) by (le))'
        cpu: 'sum(rate(container_cpu_usage_seconds_total{selector}[5m]))'
    azure:
      resource_ids:
        - "/subscriptions/11111111-1111-1111-1111-111111111111/resourceGroups/checkout-prod/providers/Microsoft.Web/sites/checkout"
