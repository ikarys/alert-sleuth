[project]
name = "alert-sleuth"
version = "0.1.0"
description = "Read-only AIOps assistant"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "jinja2",
    "pyyaml",
    "python-multipart",
    "mcp>=2.3.0",
]

[project.scripts]
aiops = "aiops.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aiops"]
